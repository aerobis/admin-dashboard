<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="page-container">
        <div class="dashboard">
            <div class="title-container">
                <div class="dashboard-item">
                    <img src="icons/dashboard.svg" alt="dashboard" width="50px" height="50px">
                    <span class="title">Dashboard</span>
                </div>
            </div>

            <div class="content-container">
                <div class="dashboard-item">
                    <img src="icons/home.svg" alt="home icon" width="50px" height="30px">
                    <span class="dashboard-label">Home</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/profile.svg" alt="profile icon" width="50px" height="30px">
                    <span class="dashboard-label">Profile</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/messages.svg" alt="mesasges icon" width="50px" height="30px">
                    <span class="dashboard-label">Messages</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/history.svg" alt="clock icon" width="50px" height="30px">
                    <span class="dashboard-label">History</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/tasks.svg" alt="tasks icon" width="50px" height="30px">
                    <span class="dashboard-label">Tasks</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/communities.svg" alt="communities icon" width="50px" height="30px">
                    <span class="dashboard-label">Communities</span>
                </div>
            </div>

            <div class="content-container">
                <div class="dashboard-item">
                    <img src="icons/settings.svg" alt="settings icon" width="50px" height="30px">
                    <span class="dashboard-label">Settings</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/support.svg" alt="support icon" width="50px" height="30px">
                    <span class="dashboard-label">Support</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/privacy.svg" alt="privacy icon" width="50px" height="30px">
                    <span class="dashboard-label">Privacy</span>
                </div>
            </div>
        </div>

        <div class="main">

        </div>

        <div class="projects">
            a
        </div>
    </div>
</body>
</html>
