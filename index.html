<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="page-container">

        <div class="dashboard">
            <div class="content-container">
                <div class="dashboard-item">
                    <img src="icons/dashboard.svg" alt="dashboard icon" width="50px" height="50px">
                    <span class="title">Dashboard</span>
                </div>
            </div>

            <div class="content-container">
                <div class="dashboard-item">
                    <img src="icons/home.svg" alt="home icon" class="normal-icon">
                    <span class="dashboard-label">Home</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/profile.svg" alt="profile icon" class="normal-icon">
                    <span class="dashboard-label">Profile</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/messages.svg" alt="mesasges icon" class="normal-icon">
                    <span class="dashboard-label">Messages</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/history.svg" alt="clock icon" class="normal-icon">
                    <span class="dashboard-label">History</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/tasks.svg" alt="tasks icon" class="normal-icon">
                    <span class="dashboard-label">Tasks</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/communities.svg" alt="communities icon" class="normal-icon">
                    <span class="dashboard-label">Communities</span>
                </div>
            </div>

            <div class="content-container">
                <div class="dashboard-item">
                    <img src="icons/settings.svg" alt="settings icon" class="normal-icon">
                    <span class="dashboard-label">Settings</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/support.svg" alt="support icon" class="normal-icon">
                    <span class="dashboard-label">Support</span>
                </div>

                <div class="dashboard-item">
                    <img src="icons/privacy.svg" alt="privacy icon" class="normal-icon">
                    <span class="dashboard-label">Privacy</span>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="top-nav">
                <div class="nav-search">
                    <img src="icons/search.svg" alt="search icon for navigation" class="normal-icon">
                    <input type="text" id="search-field" name="search-field">
                </div>

                <div class="profile-center">
                    <img src="icons/notifications.svg" alt="notification icon" class="normal-icon">
                    <img src="avatar/avatar.jpeg" alt="user avatar" class="avatar-image"> 
                    <span class="username">Aerobis</span>
                </div>

            </div>

            <div class="bottom-nav">            
                <div class="nav-welcome">
                    <img src="avatar/avatar.jpeg" alt="user avatar" class="avatar-image"> 
                    <div class="user-text">
                        <span>Hi there,</span>
                        <span class="username">Aerobis (@aerobis)</span>
                    </div>
                </div>

                <div class="project-management-center">
                    <button class="project-management-buttons" id="new-project-button">NEW</button>
                    <button class="project-management-buttons" id="upload-project-button">UPLOAD</button>
                    <button class="project-management-buttons" id="share-project-button">SHARE</button>
                </div>
            </div>
        </div>

        <div class="projects">
            a
        </div>
    </div>
</body>
</html>
